[package]
name = "gamescope-protocols"
version = "0.1.0"
description = "Rust Wayland bindings generated from Gamescope's protocol XML"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["client", "server"]
client = ["dep:wayland-client", "wayland-protocols/client"]
server = ["dep:wayland-server", "wayland-protocols/server"]

[dependencies]
bitflags = "2.9"
wayland-backend = "0.3.15"
wayland-client = { version = "0.31.14", optional = true }
wayland-protocols = "0.32.13"
wayland-scanner = "0.31.10"
wayland-server = { version = "0.31.13", optional = true }

[lints]
workspace = true
