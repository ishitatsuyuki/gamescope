buffers {
  size_kb: 65536
  fill_policy: RING_BUFFER
}

# Native Gamescope slices, queue-delay annotations, and frame flow arrows.
data_sources {
  config {
    name: "track_event"
    track_event_config {
      disabled_categories: "*"
      enabled_categories: "gamescope.event_loop"
      enabled_categories: "gamescope.input"
      enabled_categories: "gamescope.frame"
      enabled_categories: "gamescope.xwm"
    }
  }
}

# Explain long wake-to-work gaps with scheduler state and thread names.
data_sources {
  config {
    name: "linux.ftrace"
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_wakeup"
      ftrace_events: "sched/sched_waking"
    }
  }
}

data_sources {
  config {
    name: "linux.process_stats"
    process_stats_config {
      scan_all_processes_on_start: true
    }
  }
}
